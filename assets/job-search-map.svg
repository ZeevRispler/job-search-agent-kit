    <text x="56" y="111" fill="#f6f7ff" font-size="38" font-weight="750">Your next chapter starts here.</text>
    <text x="58" y="143" fill="#bbc9e8" font-size="17">A little structure. A helpful agent. One good next step.</text>
    <path d="M180 264 C260 188 312 324 444 260 S640 210 726 264 S910 308 1008 255" fill="none" stroke="#7e9ad5" stroke-width="3" stroke-dasharray="7 9"/>
    <g stroke="#52658a" stroke-width="1">
