    </g>
    <g fill="#f6f7ff" font-size="23" font-weight="700"><text x="82" y="278">Discover</text><text x="366" y="300">Track</text><text x="650" y="278">Prepare</text><text x="934" y="300">Interview</text></g>
    <g fill="#bdcae6" font-size="13"><text x="82" y="301">Find work that fits you.</text><text x="366" y="323">Keep the evidence together.</text><text x="650" y="301">Practice one step at a time.</text><text x="934" y="323">Bring your own experience.</text></g>
    <text x="58" y="384" fill="#91a5ca" font-size="13">Your agent helps with the journey. You choose the destination.</text>
