      <rect x="342" y="210" width="232" height="134" rx="18" fill="url(#card)"/>
      <rect x="626" y="188" width="232" height="134" rx="18" fill="url(#card)"/>
      <rect x="910" y="210" width="232" height="134" rx="18" fill="url(#card)"/>
    </g>
    <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#9bf2cc"><circle cx="94" cy="222" r="12"/><path d="m103 231 9 9"/></g>
      <g stroke="#b8a4ff"><rect x="367" y="233" width="27" height="31" rx="4"/><path d="m373 243 3 3 5-6m-8 15h14"/></g>
      <g stroke="#ffcf85"><path d="M652 212h24v30h-24zM658 220h12m-12 7h8m-3-15v-5"/></g>
