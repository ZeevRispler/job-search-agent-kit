<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Your next chapter starts here</title>
  <desc id="desc">A playful route connects four stages of a job search: discover, track, prepare, and interview. A small friendly robot carries a checklist along the route.</desc>
  <defs>
    <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#101b36"/><stop offset="1" stop-color="#202650"/></linearGradient>
    <linearGradient id="card" x2="0" y2="1"><stop stop-color="#283756"/><stop offset="1" stop-color="#1d2946"/></linearGradient>
  </defs>
  <rect width="1200" height="420" rx="26" fill="url(#sky)"/>
  <g fill="#b5c9f8" opacity=".48"><circle cx="77" cy="68" r="2"/><circle cx="1123" cy="71" r="3"/><circle cx="1054" cy="367" r="2"/><circle cx="104" cy="345" r="3"/><circle cx="1084" cy="135" r="2"/></g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
